# ======================================================================
# Pipeline CI/CD — E-Converse (Spring Boot + React + MongoDB)
# ======================================================================
# Activado por: push a ci-cd-pipeline | PR a main
# Etapas: Build & Test → Docker Build & Push → Deploy → Notificar
# ======================================================================

name: CI/CD Pipeline E-Converse

on:
  push:
    branches: [ci-cd-pipeline]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: lyoks
  BACKEND_IMAGE: lyoks/e-converse-backend
  FRONTEND_IMAGE: lyoks/e-converse-frontend

jobs:
  # ================================================================
  # JOB 1: Build & Test
  # ================================================================
  build-and-test:
    name: "🔨 Build & Test"
    runs-on: ubuntu-latest

    steps:
      # ---- Clonar repositorio ----
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v4

      # ---- Configurar Java 17 ----
      - name: "☕ Configurar JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ---- Compilar Backend ----
      - name: "🔧 Compilar Backend (Spring Boot)"
        working-directory: ./backend
        run: ./mvnw -B clean compile -DskipTests

      # ---- Ejecutar Pruebas Unitarias ----
      - name: "🧪 Ejecutar Pruebas Unitarias"
        working-directory: ./backend
        run: ./mvnw -B test

      # ---- Empaquetar JAR ----
      - name: "📦 Empaquetar Backend (JAR)"
        working-directory: ./backend
        run: ./mvnw -B package -DskipTests

      # ---- Subir artefacto JAR ----
      - name: "📤 Subir artefacto JAR"
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

      # ---- Configurar Node.js 20 ----
      - name: "🟢 Configurar Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      # ---- Instalar dependencias Frontend ----
      - name: "📦 Instalar dependencias Frontend"
        working-directory: ./frontend-react
        run: npm ci

      # ---- Lint Frontend ----
      - name: "🔍 Lint Frontend"
        working-directory: ./frontend-react
        run: npm run lint || true

      # ---- Build Frontend ----
      - name: "🏗️ Build Frontend (Vite)"
        working-directory: ./frontend-react
        run: npm run build

  # ================================================================
  # JOB 2: Docker Build & Push
  # ================================================================
  docker-build-push:
    name: "🐳 Docker Build & Push"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v4

      # ---- Login a Docker Hub ----
      - name: "🔑 Login a Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Configurar Docker Buildx ----
      - name: "⚙️ Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ---- Build & Push Backend Image ----
      - name: "🐳 Build & Push Backend Image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Build & Push Frontend Image ----
      - name: "🐳 Build & Push Frontend Image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react
          file: ./frontend-react/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # JOB 3: Deploy
  # ================================================================
  deploy:
    name: "🚀 Deploy a VM"
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v4

      # ---- Desplegar vía SSH a la VM ----
      - name: "🚀 Desplegar en servidor remoto"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            sudo su
            echo "🚀 Iniciando despliegue de E-Converse..."

            # Crear directorio de trabajo si no existe
            mkdir -p ~/e-converse
            cd ~/e-converse

            # Crear/actualizar docker-compose.yml para producción
            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              backend:
                image: lyoks/e-converse-backend:latest
                restart: unless-stopped
                environment:
                  SPRING_DATA_MONGODB_URI: $SPRING_DATA_MONGODB_URI
                ports:
                  - "8080:8080"

              frontend:
                image: lyoks/e-converse-frontend:latest
                restart: unless-stopped
                ports:
                  - "8081:80"
                depends_on:
                  - backend
            COMPOSE_EOF

            # Exportar variable de MongoDB
            export SPRING_DATA_MONGODB_URI="${{ secrets.SPRING_DATA_MONGODB_URI }}"

            # Descargar imágenes más recientes
            echo "📥 Descargando imágenes más recientes..."
            docker pull lyoks/e-converse-backend:latest
            docker pull lyoks/e-converse-frontend:latest

            # Detener contenedores existentes
            echo "🛑 Deteniendo contenedores anteriores..."
            docker compose down || true

            # Levantar nuevos contenedores
            echo "🟢 Levantando nuevos contenedores..."
            SPRING_DATA_MONGODB_URI="${{ secrets.SPRING_DATA_MONGODB_URI }}" docker compose up -d

            # Verificar estado
            echo "✅ Estado de los contenedores:"
            docker compose ps

            echo "🎉 Despliegue completado exitosamente!"

  # ================================================================
  # JOB 4: Notificar
  # ================================================================
  notify:
    name: "📧 Notificar resultado"
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push, deploy]
    if: always()

    steps:
      - name: "📧 Enviar notificación por Email"
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: |
            [${{ needs.build-and-test.result == 'success' && needs.docker-build-push.result == 'success' && needs.deploy.result == 'success' && '✅ ÉXITO' || '❌ FALLO' }}] CI/CD Pipeline E-Converse — ${{ github.ref_name }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "CI/CD E-Converse <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ====================================================
             Pipeline CI/CD — E-Converse
            ====================================================

            📌 Repositorio: ${{ github.repository }}
            🌿 Rama:        ${{ github.ref_name }}
            📝 Commit:      ${{ github.sha }}
            👤 Autor:       ${{ github.actor }}
            🕐 Fecha:       ${{ github.event.head_commit.timestamp }}

            ====================================================
             Resultados por etapa
            ====================================================

            🔨 Build & Test:      ${{ needs.build-and-test.result }}
            🐳 Docker Push:       ${{ needs.docker-build-push.result }}
            🚀 Deploy:            ${{ needs.deploy.result }}

            ====================================================
             Detalles
            ====================================================

            Mensaje del commit:
            ${{ github.event.head_commit.message }}

            Ver ejecución completa:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ====================================================
             Imágenes Docker
            ====================================================

            Backend:  lyoks/e-converse-backend:latest
            Frontend: lyoks/e-converse-frontend:latest
            Tag SHA:  ${{ github.sha }}

            ---
            Este correo fue generado automáticamente por GitHub Actions.
